<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee9df"><title>人類最後の聖杯戦争｜聖杯戦争通信</title>
  <meta name="description" content="80億のマスターが同時に参戦。日本語版Wikipediaに登場する人物を相棒に選び、一日一手で世界最後の一組をめざすサバイバル。">
  <link rel="canonical" href="https://haibaratou.github.io/dictionary/grail/">
  <meta property="og:title" content="人類最後の聖杯戦争"><meta property="og:description" content="80億人から、最後のひとりへ。歴史上の人物と組んで日々の号外を生き抜こう。"><meta property="og:type" content="website">
  <meta name="twitter:card" content="player"><meta name="twitter:player" content="https://haibaratou.github.io/dictionary/grail/?play=1"><meta name="twitter:player:width" content="700"><meta name="twitter:player:height" content="700">
  <meta property="og:image" content="https://haibaratou.github.io/dictionary/grail/survivor-poster.jpg"><meta name="twitter:image" content="https://haibaratou.github.io/dictionary/grail/survivor-poster.jpg">
  <link rel="stylesheet" href="survivor.css"><script defer src="survivor-roster.js"></script><script defer src="survivor-library.js"></script><script defer src="survivor-story.js"></script><script defer src="survivor-engine.js"></script><script defer src="survivor-ui.js"></script>
</head>
<body>
  <div class="paper">
    <header class="masthead">
      <div class="mast-title"><span class="press-seal" aria-hidden="true">✳</span>聖杯戦争通信</div>
      <div class="mast-right"><span class="edition" id="edition">開戦特別号</span><button type="button" id="open-rules" class="link-button">遊び方</button></div>
    </header>
    <main id="main" tabindex="-1">
      <section id="front">
        <div class="front-grid">
          <div class="front-copy"><p class="rubric"><span></span> 世界同時開戦</p>
            <h1>人類最後の<br><em>聖杯戦争</em></h1>
            <p class="deck">80億人から、最後のひとりへ。</p>
            <p class="intro">歴史上の人物、物語の登場人物、古代の神々。日本語版Wikipediaに記録された相棒と、日々の決断を重ねて生き残れ。</p>
            <button type="button" id="draw" class="button primary">相棒候補を10人引く <span aria-hidden="true">→</span></button>
          </div>
          <figure class="front-photo"><div id="cover-image" class="image-well"></div><figcaption id="cover-caption"></figcaption></figure>
        </div>
        <div class="ticker"><div><span class="live-dot"></span><strong>開戦時の参加マスター</strong></div><div class="ticker-number">8,000,000,000 <span>人</span></div></div>
      </section>
      <section id="draft" hidden>
        <div class="section-heading"><div><p class="rubric"><span></span> 契約候補</p><h2>相棒をひとり選ぶ</h2></div><span class="page-marker" id="draft-count"></span></div>
        <p class="subhead" id="draft-note" role="status"></p><div class="candidates" id="candidates"></div>
        <button type="button" class="button secondary" id="draw-retry" hidden>候補を読み直す</button>
      </section>
      <section id="campaign" hidden>
        <div class="section-heading"><div><p class="rubric"><span></span> 生存者速報</p><h2 id="day-title"></h2></div><span class="page-marker" id="campaign-date"></span></div>
        <div id="world-meter"></div>
        <div class="dispatch-grid"><div id="daily-report"></div><aside class="decision"><h3>今日の行動</h3><div id="choices"></div><p id="opponents" class="sources"></p></aside></div>
        <div id="team"></div><div id="archives"></div>
      </section>
      <section id="result" hidden>
        <div class="section-heading"><div><p class="rubric"><span></span> 最終報</p><h2 id="ending-title"></h2></div><span class="page-marker" id="ending-day"></span></div>
        <div id="final-meter"></div><div class="result-grid"><article class="final-article" id="final-article"></article><aside id="final-team"></aside></div><div id="final-history"></div>
        <div class="result-actions"><a class="button primary" id="share" target="_blank" rel="noopener noreferrer">𝕏 に結果を投稿 <span aria-hidden="true">↗</span></a><button class="button secondary" type="button" id="copy">結果をコピー</button><button class="link-button" type="button" id="again">新しく始める →</button></div>
        <p id="share-status" role="status"></p>
      </section>
      <p id="status" role="status"></p>
    </main>
    <footer><span>聖杯戦争通信</span><span>人物資料は日本語版Wikipedia。戦況・発言・結末はフィクションです。</span></footer>
  </div>
  <dialog id="rules"><div class="dialog-wrap"><p class="rubric"><span></span> 遊び方</p><h2>生き残るには</h2><ol id="rule-list"></ol><form method="dialog"><button class="button primary">閉じる</button></form></div></dialog>
  <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
</body></html>
